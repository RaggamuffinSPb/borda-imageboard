            // Крутим вверх -> Приближаем
            currentScale += 0.1;
        } else {
            // Крутим вниз -> Отдаляем
            currentScale -= 0.1;
        }

        // Ограничения масштаба (от 0.5x до 10x)
        if (currentScale < 0.5) currentScale = 0.5;
        if (currentScale > 10) currentScale = 10;

        // Применяем масштаб
        this.style.transform = `scale(${currentScale})`;
    });


    // --- 2. Отображение имени файла (выбор файла) ---

    const fileInput = document.getElementById('fileInput');
    const fileNameSpan = document.getElementById('fileName');

    if (fileInput && fileNameSpan) {
        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                fileNameSpan.textContent = this.files[0].name;
                fileNameSpan.style.color = "#fff"; // Делаем текст белым, когда файл выбран
            } else {
                fileNameSpan.textContent = "Файл не выбран";
                fileNameSpan.style.color = "#0f0"; // Обычный зеленый
            }
        });
    }
</script>
</body>
</html>
