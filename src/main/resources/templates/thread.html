            word-break: break-all;
            opacity: 0.2; /* Немного увеличил прозрачность, чтобы было видно */
            pointer-events: none;

        }

        @keyframes matrixScan {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100px); }
        }

        .post-text {
            white-space: pre-wrap;
        }

        .btn-reply {
            font-size: 0.8em;
            color: #aaa;
            border: 1px solid #444;

            text-decoration: none;
            transition: 0.3s;
        }
        .btn-reply:hover {
            border-color: #0f0;
            color: #0f0;
        }
        .matrix-btn {
            display: inline-block;
            padding: 10px 20px;
            margin-bottom: 20px;
            background-color: #000;
            color: #0f0;
            border: 1px solid #0f0;
            text-decoration: none;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.3s;

<body>

<div class="container">
    <a href="/" class="matrix-btn">[ На главную ]</a>

    <!-- ОП-ПОСТ (Начало треда) -->
    <div class="post op-post">
        <img th:if="${op.imageName != null}" th:src="@{'/api/posts/image/' + ${op.imageName}}" alt="Image">
        <p th:text="${op.content}">Текст ОП</p>
        <small th:text="${#temporals.format(op.timestamp, 'dd.MM.yyyy HH:mm:ss')}">Время</small>
    </div>

    <hr>

    <!-- СПИСОК ОТВЕТОВ -->
    <div th:each="reply : ${replies}">
        <div class="post reply" th:id="'post-' + ${reply.id}"
             th:data-content="${reply.content}"
             th:data-image="${reply.imageName != null ? '/api/posts/image/' + reply.imageName : ''}">

            <!-- ШАПКА ПОСТА -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <div>
                    <!-- Ссылка ответа -->
                    <div th:if="${reply.replyTo != null}" style="display: inline-block; margin-right: 15px;">
                        <!-- Вызываем showTooltip при наведении, передаем ID -->
                        <a th:href="'#post-' + ${reply.replyTo}" class="matrix-glow"
                           th:onmouseenter="'showTooltip(event, ' + ${reply.replyTo} + ')'"
                           onmouseleave="hideTooltip()">
                            &gt;&gt; <span th:text="${reply.replyTo}">ID</span>
                        </a>
                    </div>

                    <!-- Сам ID поста (серенький) -->
                    <span style="color: #555;">ID: <span th:text="${reply.id}">X</span></span>
                </div>

                <!-- КНОПКА ОТВЕТИТЬ -->
                <!-- Thymeleaf подставит ID внутрь JavaScript функции -->
                <a href="#reply-form" class="btn-reply" th:onclick="'setReply(' + ${reply.id} + ')'" onclick="return false;">Ответить</a>
            </div>

            <img th:if="${reply.imageName != null}" th:src="@{'/api/posts/image/' + ${reply.imageName}}" alt="Image">
            <p class="post-text" th:text="${reply.content}">Текст ответа</p>
            <small th:text="${#temporals.format(reply.timestamp, 'dd.MM.yyyy HH:mm:ss')}">Время</small>
        </div>
    </div>

    <hr>

    <!-- ФОРМА ОТВЕТА В ТРЕД -->
    <form id="reply-form" action="#" th:action="@{/}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label>Ответ:</label>
            <textarea name="content" rows="3" required></textarea>
        </div>
        <input type="hidden" name="threadId" th:value="${op.id}">
        <div class="form-group">
            <label>Картинка (опционально):</label>
            <input type="file" name="file">
        </div>
        <button type="submit">Ответить</button>
    </form>

</div>
<!-- Контейнер для всплывающей подсказки (сначала скрыт) -->
<div id="post-tooltip" style="display: none; position: fixed; z-index: 1000; background: #000; border: 1px solid #0f0; padding: 10px; color: #0f0; max-width: 300px; pointer-events: none; box-shadow: 0 0 10px #0f0;">
    <div id="tooltip-content"></div>
    <img id="tooltip-image" src="" style="max-width: 100%; display: none; margin-top: 5px; filter: sepia(100%) hue-rotate(50deg);">
</div>

<!-- lightbox для пикчи -->
<div id="lightbox" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center; cursor:pointer;" onclick="this.style.display='none'">
    <img id="lightbox-img" src="" style="max-width:95%; max-height:95%; object-fit:contain;">
</div>

<script>
    // --- 1. Лайтбокс и ЗУМ (Теперь и тут работает зум!) ---

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    let currentScale = 1; // Текущий масштаб

    // Вешаем обработчик на все картинки
    document.querySelectorAll('.post img').forEach(img => {
        img.onclick = function(e) {
            e.stopPropagation();

            // Сбрасываем зум при открытии новой картинки
            currentScale = 1;
            lightboxImg.style.transform = 'scale(1)';

            lightboxImg.src = this.src;
            lightbox.style.display = 'flex';
        }
    });

    // Обработка скролла колесом мыши для зума
    lightboxImg.addEventListener('wheel', function(event) {
        event.preventDefault();

        if (event.deltaY < 0) {
            currentScale += 0.1; // Приближаем
        } else {
            currentScale -= 0.1; // Отдаляем
        }

        // Ограничения масштаба
        if (currentScale < 0.5) currentScale = 0.5;
        if (currentScale > 10) currentScale = 10;

        this.style.transform = `scale(${currentScale})`;
    });


    // --- 2. Логика Ответа (Существующая функциональность) ---
    function setReply(postId) {
        const replyToInput = document.querySelector('input[name="replyTo"]');
        if (!replyToInput) {
            const form = document.querySelector('form');
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'replyTo';
            form.appendChild(input);
        }
        document.querySelector('input[name="replyTo"]').value = postId;
        document.querySelector('#reply-form').scrollIntoView({behavior: 'smooth'});
        document.querySelector('textarea[name="content"]').focus();
    }

    // --- 3. Логика Тултипа (Существующая функциональность) ---
    const tooltip = document.getElementById('post-tooltip');
    const tooltipContent = document.getElementById('tooltip-content');
    const tooltipImage = document.getElementById('tooltip-image');

    function showTooltip(e, postId) {
        // Ищем элемент поста на странице по его ID
        const targetPost = document.getElementById('post-' + postId);

        if (targetPost) {
            // Достаем данные из атрибутов data-*
            const content = targetPost.getAttribute('data-content');
            const imgSrc = targetPost.getAttribute('data-image');

            // Заполняем тултип
            tooltipContent.textContent = content ? (content.length > 100 ? content.substring(0, 100) + '...' : content) : '';

            if (imgSrc) {
                tooltipImage.src = imgSrc;
                tooltipImage.style.display = 'block';
            } else {
                tooltipImage.style.display = 'none';
            }

            tooltip.style.display = 'block';
            moveTooltip(e);
        } else {
            tooltip.style.display = 'none';
        }
    }

    function moveTooltip(e) {
        const x = e.clientX + 15;
        const y = e.clientY + 15;

        tooltip.style.left = x + 'px';
        tooltip.style.top = y + 'px';
    }

    function hideTooltip() {
        tooltip.style.display = 'none';
    }
</script>
</body>
</body>
</html>
